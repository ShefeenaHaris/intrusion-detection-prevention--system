{% extends "Expert/experthome.html" %}
{% block body %}


  <div class="container">
    <h2 class="mb-4">View Profile</h2>
    <form>

        <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Photo</label>
        <div class="col-sm-8">
            <img src="{{ data.photo }}" height="100px" width="50px">
        </div>
      </div>

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Name  :</label>
        <div class="col-sm-8">{{ data.name }}
        </div>
      </div>



      <div class="row mb-3">
        <label for="dob" class="col-sm-4 ">Date of Birth  :</label>
        <div class="col-sm-8">{{ data.dob }}
        </div>
      </div>

      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address  :</label>
        <div class="col-sm-8">{{ data.email_id }}
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number  :</label>
        <div class="col-sm-8">{{ data.phone_no }}
      </div>
      </div>
      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Place  :</label>
        <div class="col-sm-8">{{ data.place }}
        </div>
      </div>



      <div class="row mb-3">
        <label for="Post" class="col-sm-4 ">Post  :</label>
        <div class="col-sm-8">{{ data.post }}
        </div>
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pincode  :</label>
        <div class="col-sm-8">{{ data.pin_code }}
        </div>
      </div>

    </form>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
