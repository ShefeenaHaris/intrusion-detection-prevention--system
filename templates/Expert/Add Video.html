{% extends "Expert/experthome.html" %}
{% block body %}

<h4>Add Video</h4>
    <form method="post" action="/myapp/expert_add_video_post/" enctype="multipart/form-data">
      
{% csrf_token %}
      <!-- Complaint Text -->
      <div class="mb-3">
        <label for="Title" class="form-label">Title</label>
        <textarea class="form-control" id="title" name="title" rows="4" placeholder="Write your title here..." required></textarea>
      </div>

      <!-- Optional File Upload -->
      <div class="mb-3">
        <label for="video" class="form-label">Attach video (optional)</label>
        <input type="file" class="form-control" id="video"  name="video">
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Upload Video</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


{% endblock %}
