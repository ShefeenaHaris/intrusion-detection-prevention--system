{% extends "Expert/experthome.html" %}
{% block body %}

<body><h4>Add Video</h4>
    <form method="post" action="/myapp/expert_edit_video_post/" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ data.id }}">
      

      <!-- Complaint Text -->
      <div class="mb-3">
        <label for="Title" class="form-label">Title</label>
        <textarea class="form-control" id="complaint" rows="4" name="title" placeholder="Write your title here..." required>{{ data.title }}</textarea>
      </div>

      <!-- Optional File Upload -->
      <div class="mb-3">
           <video controls width="800px" height="450px" src="{{ data.video  }}">

              </video>
        <label for="photo" class="form-label">Attach video (optional)</label>
        <input type="file" class="form-control" id="photo"  name="video">
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
{% endblock %}
