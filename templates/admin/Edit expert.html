{% extends 'admin/adminhome.html' %}
{% block body %}
  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .form-container {
      display: flex;
      gap: 20px;
    }
    .form-section {
      flex: 2;
    }
    .photo-section {
      flex: 1;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .photo-box {
      width: 100%;
      height: 180px;
      border: 1px solid #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
      margin-bottom: 10px;
    }
    .btn-group-custom {
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h4><b>Edit Expert</b></h4>
  <div class="form-container">
    <!-- Left side form -->
    <div class="form-section">
      <form action="/myapp/admin_Edit_expert_post/" method="post" enctype="multipart/form-data">
          {% csrf_token %}
           <input type="hidden" class="form-control" placeholder="Full name" name="eid" value="{{ data.id }}">
        <div class="mb-3">
          <label class="form-label">Name :</label>
          <input type="text" class="form-control" placeholder="Full name" name="name" value="{{ data.name }}">
        </div>

        <div class="mb-3">
          <label class="form-label">Email ID :</label>
          <input type="email" class="form-control" placeholder="name@example.com" name="email" value="{{ data.email_id }}">
        </div>

        <div class="row mb-3">
          <div class="col">
            <label class="form-label">DOB :</label>
            <input type="text" class="form-control" placeholder="dd/mm/yyyy" name="dob" value="{{ data.dob }}">
          </div>
          <div class="col">
            <label class="form-label">Phone no :</label>
            <input type="text" class="form-control" placeholder="e.g. 987654321033" name="phone" value="{{ data.phone_no }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Address :</label>
          <div class="row mb-2">
            <div class="col">
              <input type="text" class="form-control" placeholder="Place" name="Place" value="{{ data.place }}">
            </div>
            <div class="col">
              <input type="text" class="form-control" placeholder="Post" name="post" value="{{ data.post }}">
            </div>
          </div>
          <input type="text" class="form-control" placeholder="PIN code" name="pin" value="{{ data.pin_code }}">
        </div>

        <div class="mb-3">
          <label class="form-label">Qualification :</label>
          <input type="text" class="form-control" placeholder="Qualification" name="qualification" value="{{ data.qualification }}">
        </div>

        <div class="mb-3">
          <label class="form-label">Experience :</label>
          <input type="text" class="form-control" placeholder="e.g. 2 years" name="experience" value="{{ data.experience }}">
        </div>
 <div class="mb-3">
          <label class="form-label">Photo :</label>
     <img src="{{ data.photo }}" width="100" height="100">
         <input type="file" name="photo">
        </div>
        <div class="btn-group-custom">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>

    <!-- Right side photo section -->

  </div>

</body>
{% endblock %}
