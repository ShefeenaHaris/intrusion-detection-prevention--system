{% extends 'admin/adminhome.html' %}
{% block body %}
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">Password Change</h2>
                <form method="post" action="/myapp/admin_changepassword_post/">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="Password">Current Password</label>
                        <input type="text" name="currentpassword" class="form-control" id="username" placeholder="Enter your current password" required>
                    </div>
                    <div class="form-group">
                        <label for="password">New_Password</label>
                        <input type="password" name="newpassword" class="form-control" id="password" placeholder="Enter your new password" required>
                    </div>
                     <div class="form-group">
                        <label for="password">confirm_newpassword</label>
                        <input type="password" name="confirmpassword" class="form-control" id="password" placeholder="Confirm your new password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Submit</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
{% endblock %}
