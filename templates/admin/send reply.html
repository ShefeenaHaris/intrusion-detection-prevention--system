{% extends 'admin/adminhome.html' %}
{% block body %}
<body>
  <div class="container mt-5">
    <h4 class="mb-4">Send reply</h4>
    <form method="post" action="/myapp/admin_send_reply_post/">
        {% csrf_token %}
      
     <input type="hidden" value="{{ data.id }}" name="id">
      <!-- Complaint Text -->
      <div class="mb-3">
        <label for="Reply" class="form-label">Reply</label>
        <textarea name="reply" class="form-control" id="complaint" rows="4" placeholder="Write your reply here..." required></textarea>
      </div>

      <!-- Optional File Upload -->


      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Send </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
{% endblock %}
