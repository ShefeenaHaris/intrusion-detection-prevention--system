
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>IDPS Security System</title>

<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>

/* ============================= */
/* Cyber Security Background */
/* ============================= */

{#body{#}
{#background:#}
{#linear-gradient(rgba(0,15,40,0.85), rgba(0,20,50,0.9)),#}
{#url("/static/home/img/cyber-bg.png");#}
{##}
{#background-size: 60% auto;#}
{#background-position:center;#}
{#background-repeat:no-repeat;#}
{#background-attachment:fixed;#}
{#background-color:#001f3f; /* fallback color */#}
{##}
{#color:white;#}
{#font-family:Arial;#}
{#overflow-x:hidden;#}
{#margin:0;#}
{#}#}


body{
background:
linear-gradient(rgba(0,15,40,0.85), rgba(0,20,50,0.9)),
url("/static/home/img/cyber.bg.png");

background-size:cover;%;   /* ✅ Fits height perfectly, reduces zoom */
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
background-color:#001f3f;

color:white;
font-family:Arial;
overflow-x:hidden;
margin:0;
}


/* ============================= */
/* HERO SECTION */
/* ============================= */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:48px;
font-weight:bold;
letter-spacing:2px;
color:#00d4ff;
text-shadow:0px 0px 15px rgba(0,212,255,0.7);
}

.hero p{
opacity:0.9;
}

/* ============================= */
/* LOGIN BUTTON */
/* ============================= */

.login-btn{
background:#00d4ff;
border:none;
padding:12px 35px;
font-weight:bold;
border-radius:30px;
transition:0.3s;
}

.login-btn:hover{
background:#00aacc;
transform:scale(1.05);
}

/* ============================= */
/* SLIDE LOGIN PANEL */
/* ============================= */

.login-panel{
position:fixed;
bottom:-100%;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#001f3f,#002a52);
transition:0.7s;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
}

.login-panel.active{
bottom:0;
}

/* ============================= */
/* GLASS LOGIN CARD */
/* ============================= */

.login-card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(15px);
padding:40px;
border-radius:15px;
box-shadow:0px 0px 30px rgba(0,212,255,0.4);
width:350px;
}

.login-title{
text-align:center;
color:#00d4ff;
margin-bottom:25px;
}

/* ============================= */
/* INPUT STYLE */
/* ============================= */

.cyber-input{
background:transparent;
border:1px solid #00d4ff;
color:white;
}

.cyber-input:focus{
background:transparent;
border-color:#00d4ff;
color:white;
box-shadow:none;
}

/* ============================= */
/* FORGOT PASSWORD */
/* ============================= */

.forgot-link{
color:#00d4ff;
}

.forgot-link:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<!-- HOME SECTION -->

<div class="hero">

<h1>🔐 IDPS Security System</h1>
<p>Real-Time Intrusion Detection & Prevention Dashboard</p>

<button class="btn login-btn mt-4" onclick="openLogin()">
Secure Login
</button>

</div>

<!-- LOGIN SLIDE PANEL -->

<div id="loginPanel" class="login-panel">

<div class="login-card">

<h3 class="login-title">Secure Access</h3>

<form method="post" action="/myapp/login_posts/">

{% csrf_token %}

<input type="text" name="names"
class="form-control cyber-input mb-3"
placeholder="Username" required>

<input type="password" name="password"
class="form-control cyber-input mb-3"
placeholder="Password" required>

<button class="btn login-btn btn-block">
Login
</button>

</form>

<div class="text-center mt-3">
<a href="/myapp/forgotpassword_get/" class="forgot-link">
Forgot Password?
</a>
</div>

</div>

</div>

<script>

function openLogin(){
document.getElementById("loginPanel").classList.add("active");
}

</script>

</body>
</html>
